name: Weekly Plugin Scan

on:
  schedule:
    # Run weekly on Sunday at 03:37 UTC. Avoid the top of the hour to reduce
    # the chance of GitHub Actions schedule delays during high-load windows.
    - cron: '37 3 * * 0'
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

permissions:
  contents: read

jobs:
  scan-and-pr:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.11'

      - name: Run Plugin Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          python .github/scripts/scan_github_plugins.py

      - name: Remove unavailable plugins
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: >-
          python .github/scripts/cleanup_registry.py --apply
          --tombstone-requests-output
          "${{ runner.temp }}/release-tombstone-requests.json"

      - name: Refresh platform metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: python .github/scripts/detect_plugin_platforms.py

      - name: Update release index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: >-
          python .github/scripts/generate_release_index.py --update
          --cache "${{ runner.temp }}/release-candidate-cache.json"
          --tombstone-requests
          "${{ runner.temp }}/release-tombstone-requests.json"
          --report-output "${{ runner.temp }}/release-index-report.json"

      - name: Validate registry and release-index binding
        env:
          RELEASE_INDEX_REPORT_PATH: "${{ runner.temp }}/release-index-report.json"
        run: python .github/scripts/validate_plugins.py

      - name: Summarize registry changes
        run: |
          python .github/scripts/summarize_registry_changes.py \
            --pr-body-output "${{ runner.temp }}/pr-body.md" \
            --commit-message-output "${{ runner.temp }}/commit-message.txt"
          cat "${{ runner.temp }}/pr-body.md" >> $GITHUB_STEP_SUMMARY

      - name: Read Commit Message
        id: get_msg
        run: |
          msg=$(cat "${{ runner.temp }}/commit-message.txt")
          echo "COMMIT_MSG=$msg" >> $GITHUB_ENV

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: ${{ env.COMMIT_MSG }}
          title: "Update Domoticz Python plugin registry from weekly scan"
          body-path: "${{ runner.temp }}/pr-body.md"
          branch: "auto-add-plugins"
          base: "master"
          delete-branch: true
          labels: "automated pr, enhancement"
          add-paths: |
            registry.json
            update_times.json
            release_index.json
            .github/platform_detection.json

      - name: Retry Create Pull Request on transient failure
        if: steps.cpr.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BODY_PATH: ${{ runner.temp }}/pr-body.md
        run: |
          echo "Initial PR creation failed, retrying with 30s wait..."
          for attempt in 1 2; do
            echo "Waiting 30 seconds before retry attempt $attempt..."
            sleep 30
            PR_NUM=$(gh api "repos/$REPO/pulls?head=${{ github.repository_owner }}:auto-add-plugins&state=open" --jq '.[0].number // empty' 2>/dev/null || true)
            if [ -n "$PR_NUM" ]; then
              echo "Pull request #$PR_NUM already exists."
              gh api "repos/$REPO/pulls/$PR_NUM" -X PATCH -F body=@"$BODY_PATH" >/dev/null 2>&1 || true
              exit 0
            fi

            PR_NUM=$(gh api "repos/$REPO/pulls" \
              -f title="Update Domoticz Python plugin registry from weekly scan" \
              -f head="auto-add-plugins" \
              -f base="master" \
              -F body=@"$BODY_PATH" \
              --jq '.number // empty' 2>/dev/null || true)

            if [ -n "$PR_NUM" ]; then
              echo "Pull request #$PR_NUM created successfully on retry attempt $attempt."
              gh api "repos/$REPO/issues/$PR_NUM/labels" -f "labels[]=automated pr" -f "labels[]=enhancement" >/dev/null 2>&1 || true
              exit 0
            fi
            echo "Retry attempt $attempt failed."
          done
          echo "All PR creation retry attempts failed."
          exit 1
