name: Generate Plugin XML Header

on:
  push:
    branches:
      - master
    paths:
      - 'registry.json'
      - 'update_times.json'
      - 'plugin_core.py'
      - '.github/scripts/generate_plugin.py'
  pull_request:
    paths:
      - 'registry.json'
      - 'update_times.json'
      - 'plugin_core.py'
      - 'plugin.py'
      - 'release_index.json'
      - '.github/scripts/generate_plugin.py'
      - '.github/workflows/generate_plugin.yml'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository without persisted credentials
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Generate plugin.py
        run: python .github/scripts/generate_plugin.py

      # release_index.json is rebound by the generate job after merge, so
      # parallel registry PRs do not conflict on registry_sha256.
      - name: Verify plugin.py is current
        run: git diff --exit-code -- plugin.py

  generate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    # Back-to-back merges queue here; each run rebinds the latest master so
    # the bot push never races a newer merge.
    concurrency:
      group: generate-master
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'

      - name: Generate plugin.py
        run: python .github/scripts/generate_plugin.py

      - name: Fetch previously published release_index.json
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            git show "$BEFORE_SHA:release_index.json" > "$RUNNER_TEMP/previous_release_index.json"
          fi

      - name: Update release_index.json registry SHA-256 binding and sequence
        run: |
          previous="$RUNNER_TEMP/previous_release_index.json"
          if [ -f "$previous" ]; then
            python .github/scripts/bind_release_index.py --previous "$previous"
          else
            python .github/scripts/bind_release_index.py
          fi

      - name: Commit and push changes
        run: |
          if git diff --quiet -- plugin.py release_index.json; then
            exit 0
          fi
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add plugin.py release_index.json
          git commit -m "Auto-generate plugin.py and update registry hash binding"
          git push
